# Stage 2-B2：A1 配置原样重跑，只换随机种子
# 目的：回答"跑了几个种子"，并检验 LoRA≈全参 这个结论是否稳健
train:
  run_name: s2b2_seed43
  max_steps: 500
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  temperature: 1.0
  beta: 0.02
  epsilon: 0.2
  scale_rewards: true
  loss_type: dapo
  learning_rate: 1.0e-5        # ← 唯一改动（10x）
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  max_grad_norm: 0.5
  max_completion_length: 700
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 250
  save_total_limit: 3
  seed: 43            # ★ 本组唯一改动：换随机种子，量run-to-run方差
lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: ["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"]
vllm:
  mode: server
  host: "0.0.0.0"
  port: 8765
log:
  report_to: ["tensorboard", "wandb"]
  project: grpo-math
